<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Object Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            cursor: crosshair;
        }

        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .detections {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .detections h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .detection-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .detection-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .detection-item:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .detection-class {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .detection-confidence {
            color: #666;
            font-size: 0.95em;
        }

        .confidence-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .no-detections {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .model-info {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
            color: #1967d2;
            font-size: 0.95em;
        }

        .fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #00ff00;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9em;
            z-index: 10;
        }

        .confidence-high {
            color: #28a745;
        }

        .confidence-medium {
            color: #ffc107;
        }

        .confidence-low {
            color: #dc3545;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .detection-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Webcam Object Detector</h1>
            <p>Real-time object detection using TensorFlow.js and COCO-SSD</p>
        </div>

        <div class="content">
            <div class="status">
                <div class="status-text">
                    <span id="statusIcon" class="loading"></span>
                    <span id="statusText">Loading model...</span>
                </div>
            </div>

            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" class="overlay-canvas"></canvas>
                <div id="fpsCounter" class="fps-counter">FPS: 0</div>
            </div>

            <div class="controls">
                <button id="startBtn" onclick="startDetection()" disabled>Start Detection</button>
                <button id="stopBtn" onclick="stopDetection()" disabled>Stop Detection</button>
                <button id="captureBtn" onclick="captureImage()" disabled>📸 Capture</button>
            </div>

            <div class="detections">
                <h3>Detected Objects</h3>
                <div id="detectionResults" class="detection-list">
                    <div class="no-detections">No objects detected yet</div>
                </div>
            </div>

            <div class="model-info">
                <strong>ℹ️ Info:</strong> This detector uses COCO-SSD model trained on 80 object classes. Point your camera at objects to detect them in real-time.
            </div>
        </div>
    </div>

    <!-- TensorFlow.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let model = null;
        let isDetecting = false;
        let detectionFrameCount = 0;
        let lastFrameTime = Date.now();
        let fps = 0;

        const statusText = document.getElementById('statusText');
        const statusIcon = document.getElementById('statusIcon');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');
        const detectionResults = document.getElementById('detectionResults');
        const fpsCounter = document.getElementById('fpsCounter');

        // Initialize the model
        async function initializeModel() {
            try {
                statusText.textContent = 'Loading COCO-SSD model...';
                model = await cocoSsd.load();
                statusText.textContent = 'Model loaded! Click "Start Detection" to begin.';
                statusIcon.style.display = 'none';
                startBtn.disabled = false;
                captureBtn.disabled = false;
            } catch (error) {
                statusText.textContent = 'Error loading model: ' + error.message;
                statusIcon.style.display = 'none';
                console.error('Model loading error:', error);
            }
        }

        // Start webcam access
        async function startDetection() {
            try {
                statusText.textContent = 'Requesting camera access...';
                statusIcon.style.display = 'inline-block';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' }
                });

                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };

                isDetecting = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusText.textContent = 'Detection running...';
                statusIcon.style.display = 'none';

                detect();
            } catch (error) {
                statusText.textContent = 'Camera access denied: ' + error.message;
                statusIcon.style.display = 'none';
                console.error('Camera error:', error);
            }
        }

        // Stop detection and camera
        function stopDetection() {
            isDetecting = false;
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            detectionResults.innerHTML = '<div class="no-detections">No objects detected yet</div>';
            statusText.textContent = 'Detection stopped. Click "Start Detection" to resume.';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            fpsCounter.textContent = 'FPS: 0';
        }

        // Main detection loop
        async function detect() {
            if (!isDetecting || !model) return;

            try {
                // Clear previous canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw video frame
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Run detection
                const predictions = await model.detect(video);

                // Draw bounding boxes
                drawDetections(predictions);

                // Update results panel
                updateDetectionResults(predictions);

                // Update FPS
                updateFPS();
            } catch (error) {
                console.error('Detection error:', error);
            }

            requestAnimationFrame(detect);
        }

        // Draw bounding boxes on canvas
        function drawDetections(predictions) {
            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                const confidence = prediction.score;

                // Draw bounding box
                ctx.strokeStyle = `hsla(${confidence * 120}, 100%, 50%, 0.8)`;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                // Draw label background
                const label = `${prediction.class} ${(confidence * 100).toFixed(1)}%`;
                ctx.font = 'bold 16px Arial';
                const textMetrics = ctx.measureText(label);
                ctx.fillStyle = `hsla(${confidence * 120}, 100%, 50%, 0.9)`;
                ctx.fillRect(x, y - 25, textMetrics.width + 10, 25);

                // Draw label text
                ctx.fillStyle = 'white';
                ctx.fillText(label, x + 5, y - 8);
            });
        }

        // Update detection results panel
        function updateDetectionResults(predictions) {
            if (predictions.length === 0) {
                detectionResults.innerHTML = '<div class="no-detections">No objects detected</div>';
                return;
            }

            // Group by class and get highest confidence for each
            const groupedDetections = {};
            predictions.forEach(pred => {
                if (!groupedDetections[pred.class] || pred.score > groupedDetections[pred.class].score) {
                    groupedDetections[pred.class] = pred;
                }
            });

            let html = '';
            Object.values(groupedDetections)
                .sort((a, b) => b.score - a.score)
                .forEach(pred => {
                    const confidence = (pred.score * 100).toFixed(1);
                    const confidenceClass = 
                        pred.score >= 0.8 ? 'confidence-high' :
                        pred.score >= 0.6 ? 'confidence-medium' : 'confidence-low';

                    html += `
                        <div class="detection-item">
                            <div class="detection-class">${pred.class}</div>
                            <div class="detection-confidence ${confidenceClass}">
                                Confidence: ${confidence}%
                            </div>
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidence}%"></div>
                            </div>
                        </div>
                    `;
                });

            detectionResults.innerHTML = html;
        }

        // Capture screenshot
        function captureImage() {
            if (!isDetecting) return;

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `detection-${Date.now()}.png`;
            link.click();
        }

        // Update FPS counter
        function updateFPS() {
            detectionFrameCount++;
            const now = Date.now();
            const elapsed = now - lastFrameTime;

            if (elapsed >= 1000) {
                fps = detectionFrameCount;
                detectionFrameCount = 0;
                lastFrameTime = now;
                fpsCounter.textContent = `FPS: ${fps}`;
            }
        }

        // Initialize on page load
        window.addEventListener('load', initializeModel);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (isDetecting) {
                stopDetection();
            }
        });
    </script>
</body>
</html>
